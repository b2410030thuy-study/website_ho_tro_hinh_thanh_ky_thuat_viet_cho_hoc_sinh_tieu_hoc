<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Viết Chữ Cái Tiếng Việt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- ==========================================
         1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ (AUTH)
         ========================================== -->
    <div id="auth-screen" class="login-wrapper">
        <div class="login-card">
            <div class="brand-icon">✏️</div>
            <div class="brand">
                <h1>BÉ HỌC VIẾT CHỮ</h1>
                <p>Hành trang vào lớp 1</p>
            </div>

            <!-- Nút chọn Vai trò (Học sinh / Giáo viên) -->
            <div class="role-switch">
                <button id="role-hs" class="role-btn active" type="button" onclick="setRole('HS')">👶 Học Sinh</button>
                <button id="role-gv" class="role-btn" type="button" onclick="setRole('GV')">👩‍🏫 Giáo Viên</button>
            </div>

            <!-- Tab Đăng nhập / Đăng ký -->
            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" type="button" onclick="switchAuthTab('login')">Đăng Nhập</button>
                <button id="tab-register" class="tab-btn" type="button" onclick="switchAuthTab('register')">Đăng Ký</button>
            </div>

            <!-- Form Nhập Thông Tin -->
            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label for="auth-username">Tên đăng nhập:</label>
                    <input type="text" id="auth-username" placeholder="Nhập tài khoản..." required>
                </div>

                <div class="input-group">
                    <label for="auth-password">Mật khẩu:</label>
                    <input type="password" id="auth-password" placeholder="Nhập mật khẩu..." required>
                </div>

                <div id="register-fullname-group" class="input-group hidden">
                    <label for="auth-fullname">Họ và tên:</label>
                    <input type="text" id="auth-fullname" placeholder="Nhập họ và tên...">
                </div>

                <button type="submit" id="btn-auth-submit" class="btn-submit">🚀 Vào Học Ngay</button>
            </form>
        </div>
    </div>

    <!-- ==========================================
         2. MÀN HÌNH CHÍNH (SAU KHI ĐĂNG NHẬP)
         ========================================== -->
    <div id="app-screen" class="main-wrapper hidden">
        
        <!-- HEADER TRÊN CÙNG -->
        <header class="top-header">
            <!-- Thẻ Thông Tin Người Dùng -->
            <div class="user-info-card">
                <div class="avatar-badge" id="user-avatar-display">✏️</div>
                <div>
                    <div class="name-display">
                        <span id="user-name-display">Học Sinh</span>
                        <button type="button" class="btn-edit-inline" onclick="openEditProfileModal()">✏️ Đổi</button>
                    </div>
                    <span id="user-role-tag" class="role-tag">Học sinh</span>
                </div>
            </div>

            <!-- THANH MENU ĐIỀU HƯỚNG (Sinh tự động qua main.js/app.js) -->
            <nav class="main-nav" id="main-nav-container">
                <!-- Nội dung nút menu sẽ được load tự động theo vai trò người dùng -->
            </nav>

            <button type="button" class="btn-logout" onclick="logout()">🚪 Thoát</button>
        </header>

        <!-- NỘI DUNG CHÍNH (THAY ĐỔI DỘNG THEO TAB) -->
        <main id="content-area">
            <!-- Nội dung các trang Học sinh/Giáo viên sẽ load ở đây -->
        </main>
    </div>

    <!-- ==========================================
         3. MODAL CẬP NHẬT HOẶC ĐỔI AVATAR / TÊN
         ========================================== -->
    <div id="profile-modal" class="modal-backdrop hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Cập Nhật Tài Khoản</h3>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="edit-name-input">Họ và tên mới:</label>
                    <input type="text" id="edit-name-input" placeholder="Nhập tên mới...">
                </div>
                <div class="input-group">
                    <label for="edit-avatar-select">Chọn Biểu Tượng (Avatar):</label>
                    <select id="edit-avatar-select" style="width:100%; padding:10px; border-radius:15px; border:3px solid #000; font-size:18px;">
                        <option value="✏️">✏️ Bút Chì</option>
                        <option value="🐱">🐱 Mèo Con</option>
                        <option value="🐶">🐶 Chú Cún</option>
                        <option value="🐻">🐻 Gấu Bông</option>
                        <option value="🦄">🦄 Kỳ Lân</option>
                        <option value="👩‍🏫">👩‍🏫 Cô Giáo</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeEditProfileModal()">Hủy</button>
                <button type="button" class="btn-save" onclick="saveProfile()">Lưu Lại</button>
            </div>
        </div>
    </div>

    <!-- NHÚNG DỮ LIỆU VÀ XỬ LÝ SỰ KIỆN -->
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
