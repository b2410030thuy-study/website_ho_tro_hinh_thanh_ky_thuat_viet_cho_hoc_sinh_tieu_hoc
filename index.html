<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Viết Chữ Cái</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="main-wrapper">
        <!-- HEADER -->
        <header class="top-header">
            <div class="user-info-card">
                <div class="avatar-badge">✏️</div>
                <div>
                    <div class="name-display">
                        <span id="user-name">Em Học Sinh</span>
                        <span class="role-tag">Học sinh</span>
                    </div>
                </div>
            </div>
            <nav class="main-nav">
                <button class="nav-btn active">📖 Học Tập</button>
            </nav>
        </header>

        <!-- KHU VỰC HỌC TẬP -->
        <main class="workspace-grid">
            <!-- CỘT TRÁI: BẢNG CHỮ CÁI -->
            <aside class="alphabet-sidebar">
                <div class="sidebar-header">
                    <h3>Bảng Chữ Cái</h3>
                </div>
                <div class="alphabet-grid" id="alphabet-grid">
                    <!-- Danh sách nút chữ cái sẽ được JavaScript tạo tự động ở đây -->
                </div>
            </aside>

            <!-- CỘT PHẢI: VIDEO & MÔ TẢ NÉT VIẾT -->
            <section class="lesson-card">
                <div class="lesson-header">
                    <div class="title-group">
                        <span class="badge-icon">🎬</span>
                        <h2 id="current-letter-title">Bài học chữ A (a)</h2>
                    </div>
                </div>

                <!-- KHUNG VIDEO YOUTUBE -->
                <div class="video-frame-container">
                    <iframe id="youtube-player" 
                            src="" 
                            title="Hướng dẫn viết chữ" 
                            frameborder="0" 
                            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                            allowfullscreen>
                    </iframe>
                </div>

                <!-- KHUNG HƯỚNG DẪN NÉT VIẾT -->
                <div class="lesson-guide">
                    <div class="guide-title">💡 Hướng dẫn nét viết:</div>
                    <p id="letter-description">Chữ a gồm 2 nét: Nét cong tròn khép kín và nét móc ngược phải.</p>
                </div>
            </section>
        </main>
    </div>

    <!-- NẠP CÁC FILE JAVASCRIPT -->
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
