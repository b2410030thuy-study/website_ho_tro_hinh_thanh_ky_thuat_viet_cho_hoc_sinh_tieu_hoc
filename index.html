<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Học Viết Chữ Cái Tiếng Việt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- 1. MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-screen" class="login-wrapper">
        <div class="login-card">
            <div class="brand-icon">✏️</div>
            <div class="brand">
                <h1>BÉ HỌC VIẾT CHỮ</h1>
                <p>Hành trang vào lớp 1</p>
            </div>

            <div class="role-switch">
                <button id="role-hs" class="role-btn active" onclick="setRole('HS')">👶 Học Sinh</button>
                <button id="role-gv" class="role-btn" onclick="setRole('GV')">👩‍🏫 Giáo Viên</button>
            </div>

            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" onclick="switchAuthTab('login')">Đăng Nhập</button>
                <button id="tab-register" class="tab-btn" onclick="switchAuthTab('register')">Đăng Ký</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label>Tên đăng nhập:</label>
                    <input type="text" id="auth-username" placeholder="Nhập tài khoản..." required>
                </div>
                <div class="input-group">
                    <label>Mật khẩu:</label>
                    <input type="password" id="auth-password" placeholder="Nhập mật khẩu..." required>
                </div>
                <div id="register-fullname-group" class="input-group hidden">
                    <label>Họ và tên:</label>
                    <input type="text" id="auth-fullname" placeholder="Nhập họ và tên...">
                </div>
                <button type="submit" id="btn-auth-submit" class="btn-submit">🚀 Vào Học Ngay</button>
            </form>
            <div id="auth-error" class="error-banner hidden"></div>
        </div>
    </div>

    <!-- 2. MÀN HÌNH CHÍNH (SAU KHI ĐĂNG NHẬP) -->
    <div id="app-screen" class="main-wrapper hidden">
        <!-- HEADER TOP -->
        <header class="top-header">
            <div class="user-info-card">
                <div class="avatar-badge" id="user-avatar-display">✏️</div>
                <div>
                    <div class="name-display">
                        <span id="user-name-display">Học Sinh</span>
                        <button class="btn-edit-inline" onclick="openEditProfileModal()">✏️ Đổi</button>
                    </div>
                    <span id="user-role-tag" class="role-tag">Học sinh</span>
                </div>
            </div>

            <!-- THANH MENU ĐIỀU HƯỚNG -->
            <nav class="main-nav" id="main-nav-container">
                <!-- Điều hướng tự động sinh theo vai trò trong main.js -->
            </nav>

            <button class="btn-logout" onclick="logout()">🚪 Thoát</button>
        </header>

        <!-- NỘI DUNG CÁC TRANG -->
        <main id="content-area">
            <!-- Trang sẽ được load động bằng JavaScript -->
        </main>
    </div>

    <!-- MODAL ĐỔI TÊN & AVATAR -->
    <div id="profile-modal" class="modal-backdrop hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Cập Nhật Tải Khoản</h3>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Họ và tên mới:</label>
                    <input type="text" id="edit-name-input">
                </div>
                <div class="input-group">
                    <label>Chọn Biểu Tượng (Avatar):</label>
                    <select id="edit-avatar-select" style="width:100%; padding:10px; border-radius:15px; border:3px solid #000; font-size:18px;">
                        <option value="✏️">✏️ Bút Chì</option>
                        <option value="🐱">🐱 Mèo Con</option>
                        <option value="🐶">🐶 Chú Cún</option>
                        <option value="🐻">🐻 Gấu Bông</option>
                        <option value="🦄">🦄 Kỳ Lân</option>
                        <option value="👩‍🏫">👩‍🏫 Cô Giáo</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn-cancel" onclick="closeEditProfileModal()">Hủy</button>
                <button class="btn-save" onclick="saveProfile()">Lưu Lại</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
