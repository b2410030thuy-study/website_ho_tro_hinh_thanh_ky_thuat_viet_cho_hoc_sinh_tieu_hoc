<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bé Học Viết Chữ Cái Tiếng Việt</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- MÀN HÌNH ĐĂNG NHẬP / ĐĂNG KÝ -->
    <div id="auth-screen" class="login-wrapper">
        <div class="login-card">
            <div class="brand-icon">✏️</div>
            <div class="brand">
                <h1>BÉ HỌC VIẾT CHỮ</h1>
                <p>Hành trang vui học vào lớp 1 🌟</p>
            </div>

            <div class="role-switch">
                <button id="role-hs" class="role-btn active" type="button" onclick="setRole('HS')">👶 Học Sinh</button>
                <button id="role-gv" class="role-btn" type="button" onclick="setRole('GV')">👩‍🏫 Giáo Viên</button>
            </div>

            <div class="auth-tabs">
                <button id="tab-login" class="tab-btn active" type="button" onclick="switchAuthTab('login')">Đăng Nhập</button>
                <button id="tab-register" class="tab-btn" type="button" onclick="switchAuthTab('register')">Đăng Ký</button>
            </div>

            <form id="auth-form" onsubmit="handleAuth(event)">
                <div class="input-group">
                    <label for="auth-username">Tên tài khoản:</label>
                    <input type="text" id="auth-username" placeholder="Nhập tên tài khoản..." required>
                </div>

                <div class="input-group">
                    <label for="auth-password">Mật khẩu:</label>
                    <input type="password" id="auth-password" placeholder="Nhập mật khẩu..." required>
                </div>

                <div id="register-fullname-group" class="input-group hidden">
                    <label for="auth-fullname">Họ và tên bé / cô:</label>
                    <input type="text" id="auth-fullname" placeholder="Nhập họ và tên...">
                </div>

                <button type="submit" id="btn-auth-submit" class="btn-submit">🚀 BẮT ĐẦU VUI HỌC</button>
            </form>
        </div>
    </div>

    <!-- MÀN HÌNH CHÍNH -->
    <div id="app-screen" class="main-wrapper hidden">
        <header class="top-header">
            <div class="user-info-card">
                <div class="avatar-badge" id="user-avatar-display">🐱</div>
                <div>
                    <div class="name-display">
                        <span id="user-name-display">Bé Tin Tin</span>
                        <button type="button" class="btn-edit-inline" onclick="openEditProfileModal()">✏️ Sửa</button>
                    </div>
                    <span id="user-role-tag" class="role-tag">Học sinh</span>
                </div>
            </div>

            <nav class="main-nav" id="main-nav-container">
                <!-- Tự động load menu qua JS -->
            </nav>

            <button type="button" class="btn-logout" onclick="logout()">🚪 Thoát</button>
        </header>

        <main id="content-area">
            <!-- Nội dung bài học hoặc trang giáo viên sẽ load ở đây -->
        </main>
    </div>

    <!-- MODAL ĐỔI ĐỔI TÊN / AVATAR -->
    <div id="profile-modal" class="modal-backdrop hidden">
        <div class="modal-box">
            <div class="modal-header">
                <h3>Cập Nhật Hồ Sơ 🎨</h3>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label for="edit-name-input">Tên hiển thị mới:</label>
                    <input type="text" id="edit-name-input" placeholder="Nhập tên mới...">
                </div>
                <div class="input-group">
                    <label for="edit-avatar-select">Chọn hình đại diện:</label>
                    <select id="edit-avatar-select" style="width:100%; padding:12px; border-radius:18px; border:3px solid #E2E8F0; font-size:18px; font-weight:700;">
                        <option value="🐱">🐱 Mèo Con</option>
                        <option value="🐶">🐶 Chú Cún</option>
                        <option value="🐻">🐻 Gấu Bông</option>
                        <option value="🦄">🦄 Kỳ Lân</option>
                        <option value="🐰">🐰 Thỏ Trắng</option>
                        <option value="👩‍🏫">👩‍🏫 Cô Giáo</option>
                    </select>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn-cancel" onclick="closeEditProfileModal()">Hủy</button>
                <button type="button" class="btn-save" onclick="saveProfile()">Lưu Lại ✨</button>
            </div>
        </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
